name: Build Pirate69 WordPress Theme

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pirate69-theme/**"
      - ".github/workflows/build-theme.yml"

permissions:
  contents: read

jobs:
  package-theme:
    name: Build installable WordPress theme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate theme structure
        run: |
          test -f pirate69-theme/style.css || {
            echo "::error::pirate69-theme/style.css is missing"
            exit 1
          }
          grep -q "Theme Name:" pirate69-theme/style.css || {
            echo "::error::style.css does not contain a WordPress Theme Name header"
            exit 1
          }
          test -f pirate69-theme/functions.php
          test -f pirate69-theme/index.php

      # upload-artifact creates the downloadable ZIP. By uploading the
      # contents of pirate69-theme (rather than the parent folder), style.css
      # is placed at the ZIP root, exactly where WordPress expects it.
      - name: Upload installable theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pirate69-theme.zip
          path: pirate69-theme/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
